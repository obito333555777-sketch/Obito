<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INFINITY CHAT</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #fff5fa;
  color: #333;
  min-height: 100vh;
}

button {
  cursor: pointer;
}

#home {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 25px;
  background: radial-gradient(circle, #ffc1dc, #ffe6f1 45%, #ffffff 85%);
}

.logo {
  font-size: 48px;
  font-weight: 900;
  letter-spacing: 7px;
  color: #ff1493;
  text-shadow: 0 0 15px #ffb6d5;
  margin-bottom: 12px;
  text-align: center;
}

.subtitle {
  color: #9c5275;
  letter-spacing: 3px;
  margin-bottom: 35px;
  text-align: center;
}

.roomBox {
  width: 100%;
  max-width: 430px;
}

.roomBox input {
  width: 100%;
  padding: 16px;
  background: #fff;
  color: #333;
  border: 1px solid #ff8fc4;
  border-radius: 10px;
  outline: none;
  font-size: 16px;
  margin-bottom: 10px;
}

.roomBox input:focus,
.textInput:focus {
  border-color: #ff1493;
  box-shadow: 0 0 8px #ffc1dc;
}

.enter {
  width: 100%;
  padding: 15px;
  background: #ff69b4;
  color: white;
  border: 0;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
}

.enter:hover {
  background: #ff1493;
}

#error {
  color: #e60073;
  margin-top: 15px;
  display: none;
  text-align: center;
}

#chat {
  display: none;
  height: 100vh;
  height: 100dvh;
  flex-direction: column;
  background: #fff5fa;
}

.header {
  padding: 15px;
  background: #ffe0ed;
  border-bottom: 1px solid #ff9fc9;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.title {
  color: #ff1493;
  font-weight: bold;
  letter-spacing: 2px;
  overflow-wrap: anywhere;
}

.exit {
  flex-shrink: 0;
  background: #fff;
  color: #e60073;
  border: 1px solid #ff8fc4;
  padding: 8px 12px;
  border-radius: 7px;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
  overscroll-behavior: contain;
}

.message {
  max-width: 85%;
  background: #fff;
  color: #333;
  border-left: 3px solid #ff69b4;
  padding: 10px;
  border-radius: 10px;
  margin-bottom: 12px;
  overflow-wrap: anywhere;
  box-shadow: 0 2px 8px #ffc1dc;
}

.message.me {
  margin-left: auto;
  background: #ffd6e8;
  color: #4a1830;
  border-left: 0;
  border-right: 3px solid #ff1493;
}

.senderName {
  font-size: 12px;
  font-weight: bold;
  color: #ff1493;
  margin-bottom: 5px;
}

.message img,
.message video {
  max-width: 280px;
  width: 100%;
  border-radius: 8px;
  display: block;
  height: auto;
}

.message audio {
  width: 100%;
  max-width: 250px;
}

.msgActions {
  margin-top: 7px;
  display: flex;
  gap: 5px;
}

.msgActions button {
  background: #fff0f7;
  color: #c21868;
  border: 1px solid #ffadd2;
  padding: 5px 8px;
  border-radius: 5px;
  font-size: 11px;
}

.time {
  color: #a16c86;
  font-size: 10px;
  margin-top: 5px;
}

.inputArea {
  padding: 10px;
  background: #ffe0ed;
  border-top: 1px solid #ff9fc9;
}

.inputRow {
  display: flex;
  gap: 6px;
  align-items: center;
}

.textInput {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border-radius: 9px;
  border: 1px solid #ffadd2;
  background: #fff;
  color: #333;
  outline: none;
}

.textInput::placeholder {
  color: #b58a9e;
}

.iconBtn {
  flex-shrink: 0;
  width: 43px;
  height: 43px;
  border: 0;
  border-radius: 9px;
  background: #ff85bd;
  color: white;
  font-size: 19px;
}

.iconBtn:hover {
  background: #ff1493;
}

.send {
  background: #ff1493;
}

.recording {
  background: #e60073 !important;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

#cameraBox {
  display: none;
  padding: 10px;
  background: #fff0f7;
  text-align: center;
}

#cameraPreview {
  width: 100%;
  max-width: 350px;
  max-height: 300px;
  border-radius: 10px;
  background: #fff;
}

.cameraButtons {
  margin-top: 8px;
  display: flex;
  justify-content: center;
  gap: 8px;
}

.cameraButtons button {
  padding: 9px 14px;
  border: 0;
  border-radius: 7px;
  background: #ff69b4;
  color: white;
}

#uploadStatus {
  display: none;
  padding: 6px 10px;
  color: #c21868;
  font-size: 12px;
  background: #fff0f7;
}

@media (max-width: 500px) {
  .logo {
    font-size: 40px;
    letter-spacing: 5px;
  }

  .message {
    max-width: 90%;
  }

  .iconBtn {
    width: 36px;
    height: 40px;
    font-size: 16px;
  }

  .inputRow {
    gap: 4px;
  }

  .textInput {
    padding: 11px 8px;
  }

  .header {
    padding: 12px;
  }
}
</style>
</head>

<body>

<section id="home">
  <div class="logo">INFINITY</div>
  <div class="subtitle">PRIVATE CHAT ROOMS</div>

  <div class="roomBox">
    <input id="userName" type="text"
      placeholder="Enter your name..."
      autocomplete="off" maxlength="30">

    <input id="roomCode" type="text"
      placeholder="Enter room code..."
      autocomplete="off" maxlength="50">

    <button class="enter" id="joinButton">JOIN ROOM</button>
  </div>

  <div id="error" role="alert"></div>
</section>


<section id="chat">

  <header class="header">
    <div class="title">💗 ROOM: <span id="roomName"></span></div>
    <button class="exit" id="exitButton">EXIT</button>
  </header>

  <div id="cameraBox">
    <video id="cameraPreview" autoplay playsinline></video>

    <div class="cameraButtons">
      <button id="takePhotoButton">📸 Take Photo</button>
      <button id="closeCameraButton">✖ Close</button>
    </div>
  </div>

  <main class="messages" id="messages"></main>

  <div id="uploadStatus" role="status"></div>

  <div class="inputArea">
    <div class="inputRow">

      <button class="iconBtn" id="cameraButton" title="Open camera">📸</button>

      <input id="gallery" type="file" accept="image/*" hidden>

      <button class="iconBtn" id="galleryButton" title="Choose image">🖼️</button>

      <input id="videoGallery" type="file" accept="video/*" hidden>

      <button class="iconBtn" id="videoButton" title="Send video">🎥</button>

      <button id="voiceButton" class="iconBtn" title="Record voice">🎤</button>

      <input id="messageInput" class="textInput"
        type="text" placeholder="Type message..."
        autocomplete="off" maxlength="2000">

      <button class="iconBtn send" id="sendButton" title="Send message">➤</button>

    </div>
  </div>

</section>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  set,
  onChildAdded,
  onChildRemoved,
  query,
  limitToLast
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

import {
  getStorage,
  ref as storageRef,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-storage.js";


/* FIREBASE CONFIG */

const firebaseConfig = {
  apiKey: "AIzaSyC0KoOuycs7ny_L7Ec3Nmia3qZ1Ix9phL0",
  authDomain: "akatsuki-chat-20b36.firebaseapp.com",
  databaseURL: "https://akatsuki-chat-20b36-default-rtdb.firebaseio.com",
  projectId: "akatsuki-chat-20b36",
  storageBucket: "akatsuki-chat-20b36.firebasestorage.app",
  messagingSenderId: "979101039921",
  appId: "1:979101039921:web:8ce8464f4e268449d8c410"
};


/* INITIALIZE FIREBASE */

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const storage = getStorage(app);


/* ELEMENTS */

const home = document.getElementById("home");
const chat = document.getElementById("chat");
const userNameInput = document.getElementById("userName");
const roomCodeInput = document.getElementById("roomCode");
const errorBox = document.getElementById("error");
const roomName = document.getElementById("roomName");
const messagesBox = document.getElementById("messages");
const messageInput = document.getElementById("messageInput");
const gallery = document.getElementById("gallery");
const videoGallery = document.getElementById("videoGallery");
const cameraBox = document.getElementById("cameraBox");
const cameraPreview = document.getElementById("cameraPreview");
const voiceButton = document.getElementById("voiceButton");
const uploadStatus = document.getElementById("uploadStatus");


/* STATE */

let currentRoom = "";
let currentUserName = "";
let myId = localStorage.getItem("infinityDeviceId");

if (!myId) {
  myId = crypto.randomUUID();
  localStorage.setItem("infinityDeviceId", myId);
}

let unsubscribe = null;
let unsubscribeRemoved = null;
let cameraStream = null;
let mediaRecorder = null;
let audioChunks = [];
let isJoining = false;

userNameInput.value = localStorage.getItem("infinityUserName") || "";


/* HELPERS */

function showError(message) {
  errorBox.textContent = message;
  errorBox.style.display = "block";
}

function hideError() {
  errorBox.style.display = "none";
}

function setUploadStatus(message) {
  uploadStatus.textContent = message;
  uploadStatus.style.display = message ? "block" : "none";
}

function formatTime(timestamp) {
  return new Date(timestamp || Date.now()).toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit"
  });
}

function scrollToBottom() {
  messagesBox.scrollTop = messagesBox.scrollHeight;
}


/* JOIN ROOM */

async function joinRoom() {
  if (isJoining) return;

  const name = userNameInput.value.trim();
  const code = roomCodeInput.value.trim();

  if (!name) {
    showError("Please enter your name.");
    userNameInput.focus();
    return;
  }

  if (!/^[a-zA-Z0-9 _-]{1,30}$/.test(name)) {
    showError("Name can contain letters, numbers, spaces, - and _.");
    return;
  }

  if (!/^[a-zA-Z0-9_-]{1,50}$/.test(code)) {
    showError("Enter a valid room code using letters, numbers, - or _.");
    return;
  }

  isJoining = true;
  hideError();

  try {
    currentUserName = name;
    currentRoom = code;

    localStorage.setItem("infinityUserName", name);

    const messagesQuery = query(
      ref(db, "rooms/" + currentRoom + "/messages"),
      limitToLast(100)
    );

    roomName.textContent = currentRoom;
    messagesBox.replaceChildren();

    home.style.display = "none";
    chat.style.display = "flex";

    unsubscribe = onChildAdded(messagesQuery, snapshot => {
      const data = snapshot.val();
      if (data) renderMessage(snapshot.key, data);
    }, error => {
      console.error(error);
      alert("Unable to load messages. Check Firebase Database Rules.");
    });

    unsubscribeRemoved = onChildRemoved(messagesQuery, snapshot => {
      const element = document.getElementById("message-" + snapshot.key);
      if (element) element.remove();
    });

    messageInput.focus();

  } catch (error) {
    console.error(error);
    currentRoom = "";
    showError("Unable to join room. Check Firebase settings.");
  } finally {
    isJoining = false;
  }
}


/* RENDER MESSAGE */

function renderMessage(id, data) {
  const message = document.createElement("div");

  message.id = "message-" + id;
  message.className = "message" + (data.sender === myId ? " me" : "");

  const name = document.createElement("div");
  name.className = "senderName";
  name.textContent = data.sender === myId ? "You" : (data.senderName || "Guest");

  message.appendChild(name);

  if (data.type === "text") {
    const text = document.createElement("div");
    text.textContent = data.text || "";
    message.appendChild(text);

  } else if (data.type === "image") {
    const img = document.createElement("img");

    img.alt = "Shared image";
    img.loading = "lazy";
    img.src = data.data;

    img.onerror = () => {
      img.alt = "Image failed to load";
      console.error("Image loading failed:", id);
    };

    message.appendChild(img);

  } else if (data.type === "video") {
    const video = document.createElement("video");

    video.controls = true;
    video.preload = "metadata";
    video.playsInline = true;
    video.src = data.data;

    video.onerror = () => {
      console.error("Video loading failed:", id);
    };

    message.appendChild(video);

  } else if (data.type === "audio") {
    const audio = document.createElement("audio");

    audio.controls = true;
    audio.preload = "metadata";
    audio.src = data.data;

    message.appendChild(audio);

  } else {
    return;
  }

  const time = document.createElement("div");
  time.className = "time";
  time.textContent = formatTime(data.timestamp);
  message.appendChild(time);

  if (data.sender === myId) {
    const actions = document.createElement("div");
    actions.className = "msgActions";

    const deleteButton = document.createElement("button");
    deleteButton.textContent = "Delete";

    deleteButton.addEventListener("click", async () => {
      if (!confirm("Delete this message?")) return;

      try {
        await set(
          ref(db, "rooms/" + currentRoom + "/messages/" + id),
          null
        );
      } catch (error) {
        console.error(error);
        alert("Delete failed. Check Firebase Database Rules.");
      }
    });

    actions.appendChild(deleteButton);
    message.appendChild(actions);
  }

  messagesBox.appendChild(message);
  scrollToBottom();
}


/* SEND DATA TO DATABASE */

async function sendData(payload) {
  if (!currentRoom) {
    throw new Error("No room selected.");
  }

  const messageRef = push(
    ref(db, "rooms/" + currentRoom + "/messages")
  );

  await set(messageRef, {
    ...payload,
    sender: myId,
    senderName: currentUserName || "Guest",
    timestamp: Date.now()
  });
}


/* SEND TEXT */

async function sendMessage() {
  if (!currentRoom) return;

  const text = messageInput.value.trim();
  if (!text) return;

  messageInput.value = "";

  try {
    await sendData({
      type: "text",
      text
    });
  } catch (error) {
    console.error(error);
    alert("Message send failed. Check Firebase Database Rules.");
    messageInput.value = text;
  }
}


/* IMAGE HELPERS */

function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("Unable to read file."));

    reader.readAsDataURL(file);
  });
}


/* SEND IMAGE */

async function sendImage(event) {
  const file = event.target.files?.[0];
  event.target.value = "";

  if (!file || !currentRoom) return;

  if (!file.type.startsWith("image/")) {
    alert("Please select an image.");
    return;
  }

  if (file.size > 1024 * 1024) {
    alert("Image must be under 1 MB.");
    return;
  }

  setUploadStatus("Sending image...");

  try {
    const data = await fileToDataURL(file);

    await sendData({
      type: "image",
      data
    });

  } catch (error) {
    console.error("IMAGE SEND ERROR:", error);
    alert("Image send failed: " + error.message);
  } finally {
    setUploadStatus("");
  }
}


/* SEND VIDEO USING FIREBASE STORAGE */

async function sendVideo(event) {
  const file = event.target.files?.[0];
  event.target.value = "";

  if (!file || !currentRoom) return;

  if (!file.type.startsWith("video/")) {
    alert("Please select a valid video.");
    return;
  }

  /* VIDEO LIMIT: 20 MB */

  if (file.size > 20 * 1024 * 1024) {
    alert("Video is too large. Choose a video under 20 MB.");
    return;
  }

  const safeFileName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");

  const path =
    "chatMedia/" +
    currentRoom +
    "/" +
    crypto.randomUUID() +
    "_" +
    safeFileName;

  setUploadStatus("Uploading video... Please wait.");

  try {
    const videoRef = storageRef(storage, path);

    await uploadBytes(videoRef, file, {
      contentType: file.type
    });

    const downloadURL = await getDownloadURL(videoRef);

    await sendData({
      type: "video",
      data: downloadURL,
      fileName: safeFileName,
      storagePath: path
    });

  } catch (error) {
    console.error("VIDEO UPLOAD ERROR:", error);

    alert(
      "Video upload failed. Check Firebase Storage setup and Storage Rules. " +
      (error.message || "")
    );
  } finally {
    setUploadStatus("");
  }
}


/* OPEN CAMERA */

async function openCamera() {
  if (!currentRoom) return;

  try {
    if (!navigator.mediaDevices?.getUserMedia) {
      alert("Camera requires HTTPS or localhost.");
      return;
    }

    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" },
      audio: false
    });

    cameraPreview.srcObject = cameraStream;
    cameraBox.style.display = "block";

  } catch (error) {
    console.error(error);
    alert("Unable to open camera. Check camera permission.");
  }
}


/* TAKE PHOTO */

async function takePhoto() {
  if (!cameraStream || !currentRoom) return;

  if (!cameraPreview.videoWidth) {
    alert("Camera is not ready yet.");
    return;
  }

  const canvas = document.createElement("canvas");
  const scale = Math.min(1, 800 / cameraPreview.videoWidth);

  canvas.width = Math.round(cameraPreview.videoWidth * scale);
  canvas.height = Math.round(cameraPreview.videoHeight * scale);

  const context = canvas.getContext("2d");

  if (!context) {
    alert("Unable to capture photo.");
    return;
  }

  context.drawImage(
    cameraPreview,
    0,
    0,
    canvas.width,
    canvas.height
  );

  const data = canvas.toDataURL("image/jpeg", 0.6);

  if (data.length > 400000) {
    alert("Photo is too large. Please try again.");
    return;
  }

  try {
    await sendData({
      type: "image",
      data
    });

    closeCamera();

  } catch (error) {
    console.error(error);
    alert("Photo send failed. Check Firebase Database Rules.");
  }
}


/* CLOSE CAMERA */

function closeCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
    cameraStream = null;
  }

  cameraPreview.srcObject = null;
  cameraBox.style.display = "none";
}


/* VOICE RECORDING */

async function toggleVoice() {
  if (mediaRecorder && mediaRecorder.state === "recording") {
    mediaRecorder.stop();

    voiceButton.classList.remove("recording");
    voiceButton.textContent = "🎤";

    return;
  }

  if (!navigator.mediaDevices?.getUserMedia ||
      typeof MediaRecorder === "undefined") {
    alert("Voice recording is not supported in this browser.");
    return;
  }

  if (!currentRoom) return;

  let stream;

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: true
    });

    audioChunks = [];

    let mimeType = "";

    if (MediaRecorder.isTypeSupported("audio/webm")) {
      mimeType = "audio/webm";
    } else if (MediaRecorder.isTypeSupported("audio/mp4")) {
      mimeType = "audio/mp4";
    }

    mediaRecorder = mimeType
      ? new MediaRecorder(stream, { mimeType })
      : new MediaRecorder(stream);

    const recorder = mediaRecorder;

    recorder.ondataavailable = event => {
      if (event.data && event.data.size > 0) {
        audioChunks.push(event.data);
      }
    };

    recorder.onstop = async () => {
      try {
        const audioBlob = new Blob(audioChunks, {
          type: recorder.mimeType || "audio/webm"
        });

        stream.getTracks().forEach(track => track.stop());

        if (audioBlob.size > 250 * 1024) {
          alert("Voice recording is too large. Record a shorter message.");
          return;
        }

        const reader = new FileReader();

        reader.onload = async () => {
          try {
            if (!currentRoom) return;

            await sendData({
              type: "audio",
              data: reader.result
            });

          } catch (error) {
            console.error(error);
            alert("Voice message send failed.");
          }
        };

        reader.onerror = () => {
          alert("Unable to read voice recording.");
        };

        reader.readAsDataURL(audioBlob);

      } catch (error) {
        console.error(error);
        alert("Voice recording failed.");
      }
    };

    recorder.start();

    voiceButton.classList.add("recording");
    voiceButton.textContent = "⏹️";

  } catch (error) {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
    }

    console.error(error);
    alert("Microphone permission is required.");
  }
}


/* EXIT ROOM */

function leaveRoom() {
  if (unsubscribe) {
    unsubscribe();
    unsubscribe = null;
  }

  if (unsubscribeRemoved) {
    unsubscribeRemoved();
    unsubscribeRemoved = null;
  }

  closeCamera();

  if (mediaRecorder && mediaRecorder.state === "recording") {
    mediaRecorder.stop();
  }

  voiceButton.classList.remove("recording");
  voiceButton.textContent = "🎤";

  currentRoom = "";
  messagesBox.replaceChildren();

  chat.style.display = "none";
  home.style.display = "flex";

  userNameInput.value =
    localStorage.getItem("infinityUserName") || currentUserName;

  roomCodeInput.value = "";

  setUploadStatus("");
  hideError();
}


/* BUTTON EVENTS */

document.getElementById("joinButton")
  .addEventListener("click", joinRoom);

document.getElementById("exitButton")
  .addEventListener("click", leaveRoom);

document.getElementById("sendButton")
  .addEventListener("click", sendMessage);

document.getElementById("cameraButton")
  .addEventListener("click", openCamera);

document.getElementById("galleryButton")
  .addEventListener("click", () => gallery.click());

document.getElementById("videoButton")
  .addEventListener("click", () => videoGallery.click());

document.getElementById("takePhotoButton")
  .addEventListener("click", takePhoto);

document.getElementById("closeCameraButton")
  .addEventListener("click", closeCamera);

document.getElementById("voiceButton")
  .addEventListener("click", toggleVoice);

gallery.addEventListener("change", sendImage);
videoGallery.addEventListener("change", sendVideo);

roomCodeInput.addEventListener("keydown", event => {
  if (event.key === "Enter") joinRoom();
});

userNameInput.addEventListener("keydown", event => {
  if (event.key === "Enter") roomCodeInput.focus();
});

messageInput.addEventListener("keydown", event => {
  if (event.key === "Enter") sendMessage();
});


/* CLEANUP */

window.addEventListener("beforeunload", () => {
  if (unsubscribe) unsubscribe();
  if (unsubscribeRemoved) unsubscribeRemoved();
  closeCamera();
});

</script>

</body>
</html>
